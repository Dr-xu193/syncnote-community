[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syncnote-quant-core"
version = "0.1.0"
description = "Point-in-time, evidence-first market data foundation for SyncNote."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SyncNote" }]
dependencies = []

[project.scripts]
syncnote-quant = "syncnote_quant.cli:main"

[project.optional-dependencies]
tushare = ["tushare>=1.4.24"]
duckdb = ["duckdb>=1.1.0"]
backtest = ["akquant==0.3.52"]
dev = ["pytest>=8.0", "ruff>=0.14"]
all = ["tushare>=1.4.24", "duckdb>=1.1.0", "akquant==0.3.52"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
