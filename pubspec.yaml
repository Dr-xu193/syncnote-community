name: syncnote
description: "Open-source personal knowledge, planning and research workspace"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  google_sign_in: ^7.2.0

  # ── AI ────────────────────────────────────────────────
  google_generative_ai: ^0.4.0

  # ── 状态管理 & 路由 ────────────────────────────────────
  provider: ^6.0.0
  go_router: ^14.0.0

  # ── UI ────────────────────────────────────────────────
  google_fonts: ^6.0.0
  flutter_animate: ^4.0.0

  # ── 工具 ──────────────────────────────────────────────
  uuid: ^4.5.3
  shared_preferences: ^2.0.0
  flutter_secure_storage: ^10.3.4
  intl: 0.20.2
  connectivity_plus: ^6.0.0
  path_provider: ^2.1.6
  crypto: ^3.0.6
  google_sign_in_all_platforms: ^2.0.3
  image_picker: ^1.2.3
  table_calendar: ^3.2.0
  flutter_markdown: ^0.7.7+1
  http: ^1.6.0
  html: ^0.15.6
  youtube_explode_dart: ^2.3.0
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  window_manager: ^0.5.2
  record: ^7.1.1
  system_tray: ^2.0.3
  hotkey_manager: ^0.2.3
  archive: ^4.0.9
  xml: ^6.6.1
  pdf: ^3.10.0
  printing: ^5.11.0
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  audioplayers: ^6.0.0
  pdfrx: ^2.4.7
  docx_file_viewer: ^1.0.2
  url_launcher: ^6.3.2
  local_auth: ^3.0.2
  workmanager: ^0.9.0+3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  uuid: ^4.5.3

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/exploration/
